name: Test & Deploy

on:
  push:
    branches:
      - main
      - dev

  pull_request:
    branches:
      - main
      - dev
    types: [opened, synchronize, reopened]

jobs:
  CI:
    name: CI
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 3557:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install API dependencies
        working-directory: ${{ github.workspace }}/api
        run: bun install --frozen-lockfile

      - name: API migration journal check
        working-directory: ${{ github.workspace }}/api
        run: bun run db:check

      - name: API lint
        working-directory: ${{ github.workspace }}/api
        run: bun run lint

      - name: API typecheck
        working-directory: ${{ github.workspace }}/api
        run: bun run typecheck

      - name: API tests
        working-directory: ${{ github.workspace }}/api
        run: bun run test

      - name: API finance integration tests (PostgreSQL real)
        working-directory: ${{ github.workspace }}/api
        run: bun run test:integration:finance

      - name: Install Web dependencies
        working-directory: ${{ github.workspace }}/web
        run: bun install --frozen-lockfile

      - name: Web lint
        working-directory: ${{ github.workspace }}/web
        run: bun run lint

      - name: Web typecheck
        working-directory: ${{ github.workspace }}/web
        run: bun run typecheck

  Deploy:
    name: Deploy to AWS
    needs: CI
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "yarn"
          cache-dependency-path: infra/yarn.lock

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Build Web (dev)
        if: github.ref == 'refs/heads/dev'
        working-directory: ${{ github.workspace }}/web
        run: bun install --frozen-lockfile && bun run build

      - name: Build Web (prod)
        if: github.ref == 'refs/heads/main'
        working-directory: ${{ github.workspace }}/web
        run: bun install --frozen-lockfile && bun run build

      - name: Deploy to Development
        if: github.ref == 'refs/heads/dev'
        working-directory: ${{ github.workspace }}/infra
        run: yarn install --frozen-lockfile && yarn cdk deploy --all --require-approval never
        env:
          ENVIRONMENT: dev
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET_DEV }}
          DOMAIN_CERTIFICATE_ARN: ${{ secrets.DOMAIN_CERTIFICATE_ARN }}
          INTERNAL_API_TOKEN: ${{ secrets.INTERNAL_API_TOKEN_DEV }}

      - name: Deploy to Production
        if: github.ref == 'refs/heads/main'
        working-directory: ${{ github.workspace }}/infra
        run: yarn install --frozen-lockfile && yarn cdk deploy --all --require-approval never
        env:
          ENVIRONMENT: prod
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET_PROD }}
          DOMAIN_CERTIFICATE_ARN: ${{ secrets.DOMAIN_CERTIFICATE_ARN }}
          INTERNAL_API_TOKEN: ${{ secrets.INTERNAL_API_TOKEN_PROD }}
          # No. de IPs de egress do worker de quitacao. Variavel de repo (Settings ->
          # Variables): vazia/ausente -> default 3 (4 IPs). Setar 9 ativa os 10 IPs.
          WORKER_EGRESS_COUNT: ${{ vars.WORKER_EGRESS_COUNT }}
