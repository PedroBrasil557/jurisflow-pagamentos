services:
  web:
    build:
      context: ./web
      dockerfile: Dockerfile.dev
    working_dir: /workspace/web
    ports:
      - "3555:3555"
    environment:
      PORT: "3555"
      API_PROXY_TARGET: "http://api:3556"
      VITE_API_URL: "http://localhost:3555"
      VITE_USE_POLLING: "true"
    volumes:
      - ./:/workspace
      - web_node_modules:/workspace/web/node_modules
    depends_on:
      api:
        condition: service_healthy

  api:
    build:
      context: ./api
      dockerfile: Dockerfile.dev
    working_dir: /workspace/api
    ports:
      - "3556:3556"
    environment:
      PORT: "3556"
      BETTER_AUTH_SECRET: "dev-only-secret-change-me-before-production"
      BETTER_AUTH_URL: "http://localhost:3555"
      WEB_URL: "http://localhost:3555"
      TRUSTED_ORIGINS: "http://localhost:3555,http://127.0.0.1:3555"
      DATABASE_URL: "postgresql://postgres:postgres@db:5432/app"
      S3_ENDPOINT: "http://minio:9000"
      S3_PUBLIC_URL: "http://localhost:3558"
      S3_ACCESS_KEY: "minioadmin"
      S3_SECRET_KEY: "minioadmin123"
      S3_FORCE_PATH_STYLE: "true"
      S3_PROCESS_DOCUMENTS_BUCKET: "process-documents"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      ANTHROPIC_MODEL: "${ANTHROPIC_MODEL:-claude-opus-4-8}"
      INTERNAL_API_TOKEN: "dev-internal-token-change-me"
      # Realce server-side do scan (vazio = desligado; a ingestao segue com o
      # PDF original).
      SCAN_ENHANCE_URL: "http://scan-enhance:8000"
      # Admin master de dev = admin do seed. Demais admins recebem titulares
      # Caixa via perfil de permissoes.
      MASTER_ADMIN_CPFS: "12345678909"
    volumes:
      - ./:/workspace
      - api_node_modules:/workspace/api/node_modules
    depends_on:
      db:
        condition: service_healthy
      minio-create-buckets:
        condition: service_completed_successfully
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- 'http://127.0.0.1:3556/api/system/health?source=healthcheck' >/dev/null || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Worker dedicado da fila de ingestao (scan/import). Mesma imagem/codebase da
  # API, processo separado (`bun run worker`): isola o trabalho pesado (PDF/IA) do
  # event-loop que atende requisicoes. Reivindica jobs do Postgres (claim+lease).
  ingestion-worker:
    build:
      context: ./api
      dockerfile: Dockerfile.dev
    working_dir: /workspace/api
    command: ["bun", "run", "worker"]
    # Reinicia automaticamente em crash (erro transitorio/OOM) — sem depender de
    # humano. Pode escalar: `docker compose up -d --scale ingestion-worker=2`
    # (o claim usa FOR UPDATE SKIP LOCKED, seguro com varias replicas).
    restart: unless-stopped
    environment:
      BETTER_AUTH_SECRET: "dev-only-secret-change-me-before-production"
      DATABASE_URL: "postgresql://postgres:postgres@db:5432/app"
      S3_ENDPOINT: "http://minio:9000"
      S3_PUBLIC_URL: "http://localhost:3558"
      S3_ACCESS_KEY: "minioadmin"
      S3_SECRET_KEY: "minioadmin123"
      S3_FORCE_PATH_STYLE: "true"
      S3_PROCESS_DOCUMENTS_BUCKET: "process-documents"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      ANTHROPIC_MODEL: "${ANTHROPIC_MODEL:-claude-opus-4-8}"
      INTERNAL_API_TOKEN: "dev-internal-token-change-me"
      # Realce server-side do scan (roda AQUI, no worker de ingestao).
      SCAN_ENHANCE_URL: "http://scan-enhance:8000"
      INGESTION_POLL_MS: "3000"
      INGESTION_CONCURRENCY: "2"
      # Pool de conexoes baixo por replica (nao exaurir o Postgres ao escalar).
      DB_POOL_MAX: "5"
    volumes:
      - ./:/workspace
      - api_node_modules:/workspace/api/node_modules
    depends_on:
      db:
        condition: service_healthy
      minio-create-buckets:
        condition: service_completed_successfully

  # Realce server-side do scan (parte da alternativa "Scan HD"): recebe o PDF
  # bruto da digitalizacao e devolve as paginas com iluminacao/sombra corrigidas
  # e nitidez realcada, ANTES da classificacao por IA. Best-effort: se cair, a
  # ingestao segue com o original.
  scan-enhance:
    build:
      context: ./scan-enhance
      dockerfile: Dockerfile
    ports:
      - "3560:8000"
    restart: unless-stopped
    # Teto de memoria: o realce rasteriza a 300 DPI; um PDF anomalo (MediaBox
    # gigante) poderia alocar varios GB. Com o cap, o container e morto e
    # reiniciado em vez de derrubar o host. O servico e best-effort — uma
    # rejeicao aqui so faz a ingestao seguir com o PDF original.
    mem_limit: 2g
    healthcheck:
      test: [ "CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\" || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5

  db:
    image: postgres:18-alpine
    ports:
      - "3557:5432"
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d app" ]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    ports:
      - "3558:9000"
      - "3559:9001"
    environment:
      MINIO_ROOT_USER: "minioadmin"
      MINIO_ROOT_PASSWORD: "minioadmin123"
      MINIO_CORS_ALLOW_ORIGIN: "http://localhost:3555,http://127.0.0.1:3555"
    volumes:
      - minio_data:/data

  minio-create-buckets:
    image: minio/mc
    depends_on:
      minio:
        condition: service_started
    entrypoint:
      - /bin/sh
      - -c
      - |
        until /usr/bin/mc alias set local http://minio:9000 minioadmin minioadmin123; do
          sleep 1
        done
        /usr/bin/mc mb --ignore-existing local/process-documents
        /usr/bin/mc anonymous set none local/process-documents
    restart: "no"

  # Worker RPA UNIFICADO da quitacao: um unico processo consome AMBAS as filas
  # (processos + titulares) com um POOL de slots concorrentes sobre um browser
  # Playwright headless, sob um espacador GLOBAL em memoria. Requer processo unico
  # (o espacador e em memoria) — nao escalar este servico (--scale) sem migrar o
  # pacing para estado compartilhado.
  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile.dev
    working_dir: /workspace/worker
    environment:
      API_URL: "http://api:3556"
      INTERNAL_API_TOKEN: "dev-internal-token-change-me"
      POLL_MS: "5000"
      # Espacamento global BASE entre inicios de consulta ao portal da Caixa (freio
      # educado). O freio (breaker) so DESACELERA a partir daqui. Dev conservador.
      # NOTA: degrau 5 (720ms/55 abas) SATUROU o Docker Desktop local — 55 contextos
      # Chromium sao para o Fargate 4vCPU/8GB, nao para dev. Local: use ate ~10-15.
      CONSULTA_MIN_INTERVAL_MS: "5000"
      # Slots concorrentes. Dev baixo; prod (CDK) usa 55 no degrau 5.
      CONSULTA_CONCURRENCY: "3"
      # Rampa de partida (0 -> N). Dev curto so p/ exercitar o caminho.
      SLOW_START_MS: "3000"
      # Freio de seguranca (so desacelera). Manter "1".
      BREAKER_ENABLED: "1"
      # Bloqueio de recursos ligado em dev p/ exercitar o ctx.route e validar que o
      # fluxo quitado->PDF continua integro com imagens/fontes/analytics abortados.
      BLOCK_RESOURCES: "1"
    volumes:
      - ./worker:/workspace/worker
      - worker_node_modules:/workspace/worker/node_modules
    depends_on:
      api:
        condition: service_healthy

volumes:
  web_node_modules:
  api_node_modules:
  worker_node_modules:
  postgres_data:
  minio_data:
